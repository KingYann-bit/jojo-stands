function t(key){return UI[lang][key]}
function standType(s){return lang==="en"?TYPES_EN[s[3]]||s[3]:s[3]}
function standPower(s){return lang==="en"?MORE_POWERS_EN[s[5]]||POWERS_EN[s[5]]||s[5]:s[5]}
function partName(p){return names[p]&&names[p][lang]||t("part")+" "+p}
function setLanguage(next){
 lang=next==="en"?"en":"fr";
 try{localStorage.setItem("jojo-lang",lang)}catch(e){}
 document.documentElement.lang=lang;
 document.title=lang==="en"?"JoJo Stand Collection":"Catalogue des Stands – JoJo";
 document.getElementById("kick").textContent=t("collection");
 document.getElementById("subtitle").textContent=t("subtitle");
 document.getElementById("q").placeholder=t("search");
 document.getElementById("lang-switch").setAttribute("aria-label",t("language"));
 document.getElementById("parts-label").textContent=lang==="en"?"PART":"PARTIE";
 document.getElementById("ranks-label").textContent=lang==="en"?"TIER":"RANG";
 document.getElementById("catalog-title").textContent=lang==="en"?"STAND INDEX":"LE CATALOGUE";
 document.getElementById("footer").textContent=t("footer");
 document.querySelectorAll(".lang-switch button").forEach(function(b){var active=b.getAttribute("data-lang")===lang;b.classList.toggle("on",active);b.setAttribute("aria-pressed",active?"true":"false")});
 buildChips();
 render();
 if(!detail.hidden&&detailIndex!==null)openDetail(detailIndex)
}
function radar(st){
 if(!st)return "<div class='nr'>"+t("statsUnknown")+"</div>";
 var cx=100,cy=100,R=56,p=[],g="",ax="",lb="";
 for(var i=0;i<6;i++){var a=-Math.PI/2+i*Math.PI/3,c=Math.cos(a),s=Math.sin(a),v=Math.min(V[st[i]]||0,5.5)/5;
  ax+="<line x1='100' y1='100' x2='"+(cx+R*c).toFixed(1)+"' y2='"+(cy+R*s).toFixed(1)+"'/>";
  p.push((cx+R*v*c).toFixed(1)+","+(cy+R*v*s).toFixed(1));
  lb+="<text x='"+(cx+(R+18)*c).toFixed(1)+"' y='"+(cy+(R+18)*s+5).toFixed(1)+"' text-anchor='middle'>"+UI[lang].statLabels[i]+" "+st[i]+"</text>"}
 for(var k=1;k<=5;k++){var q=[];for(var j=0;j<6;j++){var b=-Math.PI/2+j*Math.PI/3;q.push((cx+R*k/5*Math.cos(b)).toFixed(1)+","+(cy+R*k/5*Math.sin(b)).toFixed(1))}g+="<polygon points='"+q.join(" ")+"'/>"}
 return "<svg class='rd' viewBox='0 0 200 200'><g stroke='currentColor' stroke-opacity='.25' fill='none'>"+g+ax+"</g><polygon points='"+p.join(" ")+"' fill='var(--rc)' fill-opacity='.5' stroke='var(--rc)' stroke-width='2.5'/><g fill='currentColor' font-size='14'>"+lb+"</g></svg>";
}
var cur=0,cr="",srt=false,last=null,hoverTimer=null,detailCache={},detailIndex=null,cardImageObserver=null;
function card(s,k){
 var rk=rank(s[1]),n=("00"+(k+1)).slice(-3),side=s[4]?"<div class='card-stats' aria-label='"+t("stats")+"'>"+s[4].split("").map(function(v,i){return "<span class='card-stat'><span>"+UI[lang].statLabels[i]+"</span><b>"+v+"</b></span>"}).join("")+"</div>":"<div class='card-no-stats'><span>"+t("standInfo")+"</span><span>"+t("type")+": "+esc(standType(s))+"</span><span>"+t("part")+" "+s[0]+"</span></div>";
 return "<div class='c "+rk+"' data-k='"+k+"'><div class='bd'>"+rk+"</div><div class='in'><div class='hd'><b>"+esc(s[1])+"</b></div>"+
 "<div class='im' data-k='"+k+"'><div class='card-photo-placeholder'>"+t("image")+"<br>"+esc(s[1])+"</div><img data-card-photo alt='"+esc(s[1])+"' hidden></div>"+
 "<div class='ty'><span>"+t("stand")+" · "+esc(standType(s))+"</span><span>P"+s[0]+"</span></div><div class='card-bottom'><div class='card-summary'><b>"+t("ability")+"</b><span>"+esc(standPower(s))+"</span></div>"+side+"</div>"+
 "<div class='ft'><span>"+esc(s[2])+"</span><span>#"+n+"/"+D.length+"</span></div></div></div>";
}
function loadCardImage(cardElement){
 var image=cardElement.querySelector("[data-card-photo]"),frame=cardElement.querySelector(".im");
 if(!image||!frame)return;
 var s=D[+cardElement.getAttribute("data-k")];
 fetchWikiInfo(s[1]).then(function(info){
  if(!image.isConnected)return;
  if(!info||!info.image){frame.querySelector(".card-photo-placeholder").textContent=t("imageUnavailable");return}
  image.onload=function(){image.hidden=false;frame.classList.add("ready");frame.querySelector(".card-photo-placeholder").hidden=true};
  image.onerror=function(){if(image.isConnected)frame.querySelector(".card-photo-placeholder").textContent=t("imageUnavailable")};
  image.src=info.image
 }).catch(function(){if(image.isConnected)frame.querySelector(".card-photo-placeholder").textContent=t("imageUnavailable")})
}
function render(){
 var q=document.getElementById("q").value.toLowerCase(),l=[];
 D.forEach(function(s,k){
  if(cur&&s[0]!==cur)return;
  if(cr&&rank(s[1])!==cr)return;
  if(q&&(s[1]+" "+s[2]+" "+s[5]+" "+s[3]+" "+standPower(s)+" "+standType(s)).toLowerCase().indexOf(q)<0)return;
  l.push(k)});
 if(srt)l.sort(function(a,b){return OR[rank(D[a][1])]-OR[rank(D[b][1])]||a-b});
 document.getElementById("g").innerHTML=l.map(function(k){return card(D[k],k)}).join("")||"<p>"+t("nothing")+"</p>";
 document.getElementById("count").textContent=l.length+" "+(l.length===1?t("count"):t("cards"))+(cur?" · "+t("part")+" "+cur+" : "+partName(cur):"");
 if(!l.length&&cur>0&&cur<3)document.getElementById("g").innerHTML="<p class='empty-note'>"+t("emptyEarly")+"</p>";
 document.querySelectorAll("#g .c").forEach(function(el){if(cardImageObserver)cardImageObserver.observe(el);else loadCardImage(el)});
}
function chips(id,items,get,set,col){
 var el=document.getElementById(id);
 items.forEach(function(it){var b=document.createElement("button");b.className="chip"+(get()===it[0]?" on":"");b.textContent=it[1];
  if(col&&it[0])b.style.setProperty("--rc",RC[it[0]]);
  b.setAttribute("aria-pressed",get()===it[0]?"true":"false");
  b.onclick=function(){set(it[0]);[].forEach.call(el.children,function(x){x.className="chip";x.setAttribute("aria-pressed","false")});b.className="chip on";b.setAttribute("aria-pressed","true");render()};el.appendChild(b)});
}
function buildChips(){
 document.getElementById("pb").innerHTML="";
 document.getElementById("rb").innerHTML="";
 chips("pb",[[0,t("all")],[1,"P1"],[2,"P2"],[3,"P3"],[4,"P4"],[5,"P5"],[6,"P6"],[7,"P7"],[8,"P8"],[9,"P9"]],function(){return cur},function(v){cur=v});
 chips("rb",[["",t("ranks")],["S","S"],["A","A"],["B","B"],["C","C"],["D","D"]],function(){return cr},function(v){cr=v},true);
 var sort=document.getElementById("so");
 sort.textContent=srt?t("sortRank"):t("sortOrder");
 sort.onclick=function(){srt=!srt;this.textContent=srt?t("sortRank"):t("sortOrder");render()}
}
var cnt={};D.forEach(function(s){var r=rank(s[1]);cnt[r]=(cnt[r]||0)+1});
document.getElementById("sum").innerHTML=["S","A","B","C","D"].map(function(r){return "<div class='pill' style='--rc:"+RC[r]+"'><b>"+r+"</b>"+(cnt[r]||0)+"</div>"}).join("");
var g=document.getElementById("g"),zm=document.getElementById("zm");
var detail=document.getElementById("detail");
if("IntersectionObserver"in window)cardImageObserver=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){loadCardImage(entry.target);cardImageObserver.unobserve(entry.target)}})},{rootMargin:"220px"});
g.onclick=function(e){var c=e.target.closest(".c");if(c)openZ(c)};
function openZ(c){var s=D[+c.getAttribute("data-k")];
 zm.innerHTML="<div class='zw'>"+c.outerHTML+"<div class='lks'><a target='_blank' rel='noopener' href='https://www.google.com/search?tbm=isch&q="+encodeURIComponent("JoJo "+s[1]+" stand")+"'>"+t("zoomStand")+"</a><a target='_blank' rel='noopener' href='https://www.google.com/search?tbm=isch&q="+encodeURIComponent("JoJo "+s[2])+"'>"+t("zoomUser")+"</a><button class='x' type='button' aria-label='"+t("close")+"'>×</button></div></div>";
 zm.hidden=false}
zm.onclick=function(e){if(e.target===zm||e.target.closest(".x"))zm.hidden=true};
function wikiSearchUrl(term){return "https://jojowiki.com/index.php?search="+encodeURIComponent(term)}
function wikiPageUrl(title){return "https://jojowiki.com/"+encodeURIComponent(title.replace(/ /g,"_"))}
function fetchWikiInfo(term){
 if(detailCache[term])return detailCache[term];
 var params=new URLSearchParams({action:"query",prop:"pageimages|extracts",titles:term,piprop:"thumbnail",pithumbsize:"640",exintro:"1",explaintext:"1",format:"json",origin:"*"});
 detailCache[term]=fetch("https://jojowiki.com/api.php?"+params.toString()).then(function(response){
  if(!response.ok)throw new Error("JoJo Wiki (HTTP "+response.status+")");
  return response.json()
 }).then(function(data){
  var pages=data.query&&data.query.pages;
  var page=pages&&(Array.isArray(pages)?pages[0]:Object.values(pages)[0]);
  var exact=page&&page.pageid?{title:page.title,image:page.thumbnail&&page.thumbnail.source,extract:page.extract||""}:null;
  if(exact&&exact.image)return exact;
  var search=new URLSearchParams({action:"query",generator:"search",gsrsearch:term,gsrnamespace:"0",gsrlimit:"1",prop:"pageimages|extracts",piprop:"thumbnail",pithumbsize:"640",exintro:"1",explaintext:"1",format:"json",origin:"*"});
  return fetch("https://jojowiki.com/api.php?"+search.toString()).then(function(response){
   if(!response.ok)throw new Error("JoJo Wiki search (HTTP "+response.status+")");
   return response.json()
  }).then(function(result){
   var found=result.query&&result.query.pages;
   var candidate=found&&(Array.isArray(found)?found[0]:Object.values(found)[0]);
   return candidate&&candidate.pageid?{title:candidate.title,image:candidate.thumbnail&&candidate.thumbnail.source,extract:candidate.extract||""}:exact
  })
 }).catch(function(error){delete detailCache[term];throw error});
 return detailCache[term]
}
function setWikiImage(slot,term,label){
 var frame=document.getElementById(slot+"-frame"),caption=document.getElementById(slot+"-caption"),image=document.getElementById(slot+"-image");
 fetchWikiInfo(term).then(function(info){
  if(!info||!info.image){frame.innerHTML="<div class='detail-placeholder'>"+t("imageUnavailable")+"<br><a target='_blank' rel='noopener' href='"+wikiSearchUrl(term)+"'>"+t("searchImage")+"</a></div>";return}
  image.src=info.image;image.alt=label+" — "+info.title;frame.querySelector(".detail-placeholder").hidden=true;image.hidden=false;
  image.onerror=function(){if(image.isConnected)frame.innerHTML="<div class='detail-placeholder'>"+t("imageError")+"<br><a target='_blank' rel='noopener' href='"+wikiSearchUrl(term)+"'>"+t("openSource")+"</a></div>"};
  caption.textContent=info.title+" · JoJo Wiki";
  var link=document.getElementById(slot+"-source");link.href=wikiPageUrl(info.title);link.textContent=(lang==="en"?"Image source: ":"Source image : ")+info.title
 }).catch(function(){
  frame.innerHTML="<div class='detail-placeholder'>"+t("fetchError")+"<br><a target='_blank' rel='noopener' href='"+wikiSearchUrl(term)+"'>"+t("wikiSearch")+"</a></div>"
 })
}
function openDetail(k){
 var s=D[k],name=s[2],searchTerm=s[1],statMarkup="";
 if(s[4])for(var i=0;i<6;i++)statMarkup+="<div class='detail-fact'><b>"+UI[lang].stats[i]+"</b>"+esc(UI[lang].grades[s[4][i]]||s[4][i])+"</div>";
 var detailRadar=s[4]?"<div class='detail-radar'>"+radar(s[4])+"</div>":"";
 detailIndex=k;
 detail.innerHTML="<section class='detail-panel'><header class='detail-head'><h2 id='detail-title'>"+esc(s[1])+"</h2><button class='x' type='button' aria-label='"+t("close")+"'>×</button></header><div class='detail-content'><div class='detail-gallery'><figure class='detail-image' id='stand-frame'><div class='detail-placeholder'>"+t("image")+"</div><img id='stand-image' alt='' hidden><figcaption id='stand-caption'>"+t("stand")+"</figcaption></figure><figure class='detail-image' id='user-frame'><div class='detail-placeholder'>"+(name==="—"?t("noUser"):t("portrait"))+"</div><img id='user-image' alt='' hidden><figcaption id='user-caption'>"+esc(name)+"</figcaption></figure></div><div class='detail-facts'><div class='detail-fact'><b>"+t("user")+"</b>"+esc(name)+"</div><div class='detail-fact'><b>"+t("part")+"</b>"+esc(partName(s[0]))+"</div><div class='detail-fact'><b>"+t("type")+"</b>"+esc(standType(s))+"</div><div class='detail-fact'><b>"+t("personalRank")+"</b>"+rank(s[1])+" "+t("personal")+"</div><div class='detail-fact'><b>"+t("power")+"</b>"+esc(standPower(s))+"</div>"+statMarkup+"</div>"+detailRadar+"<h3>"+t("about")+"</h3><p class='detail-description' id='stand-extract'>"+esc(standPower(s))+"</p><p class='detail-description' id='user-extract'>"+(name==="—"?t("noUserListed"):t("loadingUser"))+"</p><p class='detail-status' id='wiki-status'>"+t("wikiNote")+"</p><div class='detail-sources'><a id='stand-source' target='_blank' rel='noopener' href='"+wikiSearchUrl(searchTerm)+"'>"+t("standSource")+"</a><a id='user-source' target='_blank' rel='noopener' href='"+wikiSearchUrl(name)+"'>"+(name==="—"?t("noUserSource"):t("userSource"))+"</a></div></div></section>";
 detail.hidden=false;
 setWikiImage("stand",searchTerm,"Stand");
 if(name!=="—")setWikiImage("user",name,"Utilisateur");
 fetchWikiInfo(searchTerm).then(function(info){
  var text=document.getElementById("stand-extract");
  if(text)text.textContent=info&&info.extract?info.extract+"\n\n"+t("powerCard")+" "+standPower(s)+".":t("noSummary")+" "+t("powerCard")+" "+standPower(s)+".";
  if(info){var link=document.getElementById("stand-source");link.href=wikiPageUrl(info.title);link.textContent=t("standSource").replace(/rechercher sur JoJo Wiki|search JoJo Wiki/i,info.title)}
 }).catch(function(){var text=document.getElementById("stand-extract");if(text)text.textContent=t("summaryUnavailable")});
 if(name!=="—")fetchWikiInfo(name).then(function(info){
  var text=document.getElementById("user-extract");
  if(text)text.textContent=info&&info.extract?info.extract:t("noSummary")+" "+t("noPersonSummary");
  if(info){var link=document.getElementById("user-source");link.href=wikiPageUrl(info.title);link.textContent=t("userSource").replace(/rechercher sur JoJo Wiki|search JoJo Wiki/i,info.title)}
 }).catch(function(){var text=document.getElementById("user-extract");if(text)text.textContent=t("summaryUnavailable")});
}
detail.onclick=function(e){if(e.target===detail||e.target.closest(".x"))detail.hidden=true};
document.onkeydown=function(e){if(e.key==="Escape"){zm.hidden=true;detail.hidden=true}};
function rs(c){["--rx","--ry","--mx","--my"].forEach(function(v){c.style.removeProperty(v)})}
g.onpointerover=function(e){if(e.pointerType!=="mouse")return;var c=e.target.closest(".c");if(!c||c.contains(e.relatedTarget))return;clearTimeout(hoverTimer);var k=+c.getAttribute("data-k");hoverTimer=setTimeout(function(){if(c.isConnected)openDetail(k)},3000)};
g.onpointerout=function(e){if(e.pointerType!=="mouse")return;var c=e.target.closest(".c");if(c&&!c.contains(e.relatedTarget))clearTimeout(hoverTimer)};
g.onpointermove=function(e){if(e.pointerType!=="mouse")return;var c=e.target.closest(".c");if(last&&last!==c)rs(last);last=c;if(!c)return;
 var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 c.style.setProperty("--ry",((x-.5)*14).toFixed(1)+"deg");c.style.setProperty("--rx",((.5-y)*14).toFixed(1)+"deg");c.style.setProperty("--mx",(x*100)+"%");c.style.setProperty("--my",(y*100)+"%")};
g.onpointerleave=function(){clearTimeout(hoverTimer);if(last)rs(last);last=null};
document.getElementById("q").oninput=render;
document.querySelectorAll(".lang-switch button").forEach(function(button){button.onclick=function(){setLanguage(button.getAttribute("data-lang"))}});
setLanguage(lang);
</script>
</body>
</html>
